[project]
name = "devrag"
version = "0.1.0"
description = "Ask questions about any codebase. Get answers with source citations. Local RAG with zero cost."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.3.0",
    "numpy>=1.24.0",
    "google-genai>=1.0.0",
    "groq>=0.4.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["mock_data/", "tests/eval_results.json"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["mock_data/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
