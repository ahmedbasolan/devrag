services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      - CHROMA_DIR=/app/.chroma

  eval:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    command: python tests/eval_rag.py
    profiles:
      - test
