services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./.chroma:/app/.chroma
    env_file:
      - path: .env
        required: false
    environment:
      - CHROMA_DIR=/app/.chroma

  eval:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./.chroma:/app/.chroma
      - ./tests:/app/tests
    env_file:
      - path: .env
        required: false
    command: python tests/eval_rag.py
    profiles:
      - test
